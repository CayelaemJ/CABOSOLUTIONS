name: Verify NewChanges isolated Cloudflare staging (no production data)
on:
  push:
    branches: [test/newchanges-cloudflare-staging-20261028]
permissions:
  contents: read
jobs:
  edge-readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate actual preview HTML and public brand assets over HTTPS
        run: |
          set -euo pipefail
          url="https://newchanges-cloudflare-preview.cabo-solutions-za.workers.dev"
          curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors --max-time 50 -D /tmp/nc-headers "$url/" -o /tmp/nc-home
          grep -qi 'The Fixer' /tmp/nc-home
          grep -qi 'Cloudflare staging preview' /tmp/nc-home
          grep -qi '^x-robots-tag: noindex' /tmp/nc-headers
          grep -qi '^content-security-policy:' /tmp/nc-headers
          curl -fsSL --max-time 25 "$url/static/the-fixer-brand.css" -o /tmp/nc-brand.css
          grep -q '\-\-brand-primary' /tmp/nc-brand.css
          curl -fsSL --max-time 25 "$url/static/the-fixer-logo-reversed.svg" -o /tmp/nc-logo.svg
          test -s /tmp/nc-logo.svg
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$url/login")"
          test "$status" = 403
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$url/dashboard")"
          test "$status" = 403
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$url/react/")"
          test "$status" = 403
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$url/api/auth/me")"
          test "$status" = 404
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url/api/auth/login")"
          test "$status" = 404
          manifest_status="$(curl -sS -o /tmp/nc-manifest -w '%{http_code}' "$url/static/site.webmanifest")"
          test "$manifest_status" = 200
          grep -q 'The Fixer' /tmp/nc-manifest
          icon_status="$(curl -sS -o /dev/null -w '%{http_code}' "$url/static/favicon-32.png")"
          test "$icon_status" = 302
          icon="$(curl -fsSL "$url/static/the-fixer-icon.svg")"
          test -n "$icon"
          echo "NewChanges staging website served, all tested account/data routes blocked."
          api="https://newchanges-api-canary.cabo-solutions-za.workers.dev"
          curl -fsSL --max-time 35 -D /tmp/nc-api-headers "$api/api/health" -o /tmp/nc-api-health.json
          node -e 'const h=require("/tmp/nc-api-health.json");if(h.status!=="ok"||h.production!==false||h.environment!=="cloudflare-isolated-canary")process.exit(1)'
          curl -fsSL --max-time 35 "$api/api/migration/capabilities" -o /tmp/nc-capabilities.json
          node -e 'const c=require("/tmp/nc-capabilities.json");for(const k of ["auth","dashboard","imports","schedulers","notifications"])if(c[k]!=="disabled")process.exit(1);if(c.database!=="disconnected"||c.production_render!=="unchanged")process.exit(1)'
          for route in "/api/auth/me" "/api/dashboard" "/api/admin/users" "/api/source/sync"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$api$route")"
            test "$code" = 404
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$api/api/health")"
          test "$code" = 405
          echo "Cloudflare isolated API canary tested with no live data access."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Chromium desktop/mobile public preview check
        run: npx playwright test cloudflare/tests/newchanges-staging.browser.spec.mjs --config=playwright.cloudflare.config.mjs
