name: Dependency advisory audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependency tree for security audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reject high and critical advisories
        run: npm audit --audit-level=high
