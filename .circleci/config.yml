version: 2.1
jobs:
  security_suite:
    docker:
      - image: cimg/go:1.24
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Python runtime and prerequisites
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip python3-venv curl
            python3 -m venv "$HOME/security-venv"
            echo 'export PATH="$HOME/security-venv/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Semgrep, Gitleaks, Trivy, optional Nuclei and Schemathesis
          command: bash .circleci/security.sh
          no_output_timeout: 15m
      - store_artifacts:
          path: security-reports
          destination: security-reports
  zap_baseline:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Require approved staging target
          command: |
            if [ "${SECURITY_ZAP_APPROVED:-}" != "YES_STAGING_ONLY" ] || [ -z "${SECURITY_ZAP_TARGET_URL:-}" ]; then
              echo "ZAP skipped until approved staging URL is provided"
              circleci-agent step halt
            fi
            case "$SECURITY_ZAP_TARGET_URL" in
              https://*staging*|https://*test*|https://*preview*) ;;
              *) echo "Staging/test/preview HTTPS target required"; exit 2;;
            esac
      - setup_remote_docker
      - run:
          name: OWASP ZAP passive baseline
          command: docker run --rm ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$SECURITY_ZAP_TARGET_URL" -m 1 -I
          no_output_timeout: 15m

  cloudflare_full_site_candidate:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate original CABO website plus enquiry and admin API safety
          command: |
            set -euo pipefail
            node --test tests/cloudflare-full-site.test.mjs
            node --check server.mjs
            node --check cloudflare/full-site/worker.mjs
            node --check cloudflare/full-site/gate.mjs
      - run:
          name: Compile the actual company website and bundle Cloudflare backend
          command: |
            set -euo pipefail
            npm ci --no-audit --no-fund
            npm run build
            test -s dist/index.html
            npm ci --prefix cloudflare/full-site --no-audit --no-fund
            cloudflare/full-site/node_modules/.bin/wrangler deploy --dry-run --containers-rollout=none --config wrangler.cabo-full-site.jsonc --outdir cloudflare-output/full-site
            test -s cloudflare-output/full-site/worker.js
      - store_artifacts:
          path: cloudflare-output/full-site
          destination: cabo-solutions-full-site-api-candidate

workflows:
  security_audit:
    jobs:
      - zap_baseline:
          filters:
            branches:
              only: main
      - security_suite
  cloudflare_complete_site_migration:
    jobs:
      - cloudflare_full_site_candidate:
          filters:
            branches:
              only: feat/cloudflare-full-site-api-20261029
